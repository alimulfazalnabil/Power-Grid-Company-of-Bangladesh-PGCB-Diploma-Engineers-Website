apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: enterprise-cms
  namespace: argocd
spec:
  description: Enterprise CMS GitOps project
  sourceRepos:
    - '*'
  destinations:
    - namespace: development
      server: https://kubernetes.default.svc
    - namespace: staging
      server: https://kubernetes.default.svc
    - namespace: production
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
