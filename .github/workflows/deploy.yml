name: Deploy

"on":
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - dev
          - staging
          - production
      image_tag:
        description: Optional image tag override
        required: false
        type: string
      git_ref:
        description: Git ref to deploy
        required: false
        type: string

permissions:
  id-token: write
  contents: write
  packages: write

env:
  REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}
  IMAGE_TAG: ${{ inputs.image_tag || github.sha }}

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || github.ref }}

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure Container Registry Login
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/enterprise-api:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/enterprise-api:latest

      - name: Sign API image
        run: cosign sign --yes "${{ env.REGISTRY }}/enterprise-api:${{ env.IMAGE_TAG }}"

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/enterprise-web:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/enterprise-web:latest

      - name: Sign web image
        run: cosign sign --yes "${{ env.REGISTRY }}/enterprise-web:${{ env.IMAGE_TAG }}"

      - name: Build and push cms
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/cms/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/enterprise-cms:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/enterprise-cms:latest

      - name: Sign cms image
        run: cosign sign --yes "${{ env.REGISTRY }}/enterprise-cms:${{ env.IMAGE_TAG }}"

      - name: Build and push worker if present
        if: ${{ hashFiles('apps/worker/Dockerfile') != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/enterprise-worker:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/enterprise-worker:latest

      - name: Sign worker image if present
        if: ${{ hashFiles('apps/worker/Dockerfile') != '' }}
        run: cosign sign --yes "${{ env.REGISTRY }}/enterprise-worker:${{ env.IMAGE_TAG }}"

  update-gitops:
    name: Update GitOps Values
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || github.ref }}

      - name: Update Helm values image tag
        env:
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          case "$TARGET_ENV" in
            dev) VALUES_FILE="kubernetes/enterprise-cms/values-dev.yaml" ;;
            staging) VALUES_FILE="kubernetes/enterprise-cms/values-staging.yaml" ;;
            production) VALUES_FILE="kubernetes/enterprise-cms/values-prod.yaml" ;;
            *) echo "Unsupported environment: $TARGET_ENV"; exit 1 ;;
          esac
          perl -0pi -e 's/(image:\n\s+tag:\s*).*/${1}'"${IMAGE_TAG}"'/m' "$VALUES_FILE"

      - name: Commit GitOps change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kubernetes/enterprise-cms/values-*.yaml
          if git diff --cached --quiet; then
            echo "No GitOps changes to commit"
            exit 0
          fi
          git commit -m "chore(gitops): promote ${{ inputs.environment }} to ${IMAGE_TAG}"
          git push
