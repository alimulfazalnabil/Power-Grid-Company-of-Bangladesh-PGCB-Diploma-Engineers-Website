name: CI

on:
  pull_request:
  push:
    branches:
      - alimul-fazal-nabil/set-up-the-development-environment-fxHTwH

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install pytest-cov ruff black mypy

      - name: Ruff
        run: ruff check apps/api

      - name: Black
        run: black --check apps/api

      - name: MyPy
        run: mypy apps/api/app --ignore-missing-imports

      - name: Pytest with coverage
        run: pytest apps/api/tests --cov=apps/api/app --cov-report=term-missing --cov-report=xml

  frontend-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier check
        run: pnpm exec prettier --check .

      - name: Typecheck web
        run: pnpm --filter web exec tsc --noEmit

      - name: Typecheck cms
        run: pnpm --filter cms exec tsc --noEmit

      - name: Web tests
        run: pnpm --filter web test -- --run

      - name: Build web
        run: pnpm --filter web build

      - name: Build cms
        run: pnpm --filter cms build

  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pgcb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pgcb
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: test-secret
      JWT_REFRESH_SECRET: test-refresh-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: Start API
        run: |
          cd apps/api
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          echo $! > /tmp/api.pid

      - name: Health check
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: API smoke tests
        run: pytest apps/api/tests/test_main.py

      - name: Stop API
        if: always()
        run: kill "$(cat /tmp/api.pid)"
