apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-approved-registry
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: only-acr-images
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: Images must come from the approved Azure Container Registry.
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                any:
                  - key: "{{ element.image }}"
                    operator: NotMatches
                    value: "^([a-z0-9]+\\.azurecr\\.io/).*"
