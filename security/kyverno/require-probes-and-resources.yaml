apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-probes-and-resources
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-probes
      match:
        any:
          - resources:
              kinds:
                - Deployment
      validate:
        message: Deployments must define liveness, readiness, and startup probes.
        pattern:
          spec:
            template:
              spec:
                containers:
                  - livenessProbe: {}
                    readinessProbe: {}
                    startupProbe: {}
    - name: require-resource-requests-limits
      match:
        any:
          - resources:
              kinds:
                - Deployment
      validate:
        message: Deployments must define resource requests and limits.
        pattern:
          spec:
            template:
              spec:
                containers:
                  - resources:
                      requests:
                        cpu: "?*"
                        memory: "?*"
                      limits:
                        cpu: "?*"
                        memory: "?*"
